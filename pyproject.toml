[project]
name = "speed-test-script"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "ruff>=0.16.8",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/*" = ["E501"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
speed-test = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]